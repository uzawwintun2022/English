<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz - Performing & Note Taking</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #16a085;
            --bg-color: #f8f9fa;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Top Navigation Bar */
        nav {
            background-color: var(--primary-color);
            padding: 12px 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        nav::-webkit-scrollbar { display: none; }

        .nav-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 15px;
        }

        .nav-container a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.95rem;
            display: inline-block;
        }

        .nav-container a:hover, .nav-container a.active {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Quiz Content Box */
        .quiz-body {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .score-board {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin-top: 10px;
            background: #e8f8f5;
            padding: 8px 20px;
            border-radius: 5px;
            display: inline-block;
        }

        .section-title {
            margin: 25px 0 15px 0;
            color: var(--primary-color);
            border-left: 5px solid var(--primary-color);
            padding-left: 10px;
            font-size: 1.15rem;
        }

        /* Question Cards */
        .question-card {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #eef0f2;
        }

        .question-text {
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
        }

        /* Inputs */
        .radio-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 6px 14px;
            background: white;
            border: 1px solid #ced4da;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .radio-label:hover { background: #f1f3f5; }

        .inline-answer {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .underline-input {
            border: none;
            border-bottom: 2px solid #ced4da;
            padding: 4px 10px;
            font-size: 1rem;
            width: 140px;
            outline: none;
            text-align: center;
            font-weight: bold;
            color: var(--primary-color);
            background: transparent;
        }

        /* Tabs Layout - မေးခွန်းများအောက်တွင် Margin ကန်ပြီး ပိုမိုထင်ရှားစေခြင်း */
        .tabs-container {
            display: flex;
            background: #eef2f7;
            border-radius: 8px;
            margin: 25px 0; /* မေးခွန်းနှင့် အောက်ခြေခလုတ်ကြား ထင်ရှားစေရန် Margin ကန်ထားသည် */
            padding: 6px;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #dbe2ec;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: none;
            font-size: 1rem;
            font-weight: bold;
            color: #5a6b82;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-btn:hover {
            background: rgba(0,0,0,0.04);
            color: var(--primary-color);
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 2px 6px rgba(74, 111, 165, 0.3);
        }

        /* Bottom Action Area */
        .bottom-action-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .btn-container {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-check { background-color: var(--secondary-color); color: white; }
        .btn-retry { background-color: #6c757d; color: white; }

        /* Feedback Colors */
        .correct-ans { background-color: #d4edda !important; border-color: #28a745 !important; }
        .wrong-ans { background-color: #f8d7da !important; border-color: #dc3545 !important; }
        .correct-text { color: #28a745; font-size: 0.9rem; margin-left: 10px; font-weight: bold; }
        .wrong-text { color: #dc3545; font-size: 0.9rem; margin-left: 10px; font-weight: bold; }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            .nav-container { justify-content: flex-start; gap: 10px; }
            .nav-container a { padding: 6px 12px; font-size: 0.85rem; }
            .tab-btn { font-size: 0.85rem; padding: 10px 4px; }
            .tabs-container { margin: 20px 0; padding: 4px; gap: 4px; }
            .underline-input { width: 100%; margin-top: 5px; }
            .inline-answer { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="active">Home</a>
            <a href="fill.html">Close Type</a>
            <a href="correct.html">Correct Order</a>
            <a href="match.html">Match</a>
        </div>
    </nav>

    <div class="container">
        <div class="quiz-body">
            <div class="quiz-header">
                <h2 id="quiz-main-title">English & Study Skills Quiz</h2>
                <div class="score-board">Score: <span id="score-text">0</span> / <span id="total-text">0</span></div>
            </div>

            <div id="quiz-content"></div>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('yes-no')">Yes or No</button>
            <button class="tab-btn" onclick="switchTab('bda')">B D A</button>
            <button class="tab-btn" onclick="switchTab('abbrev')">Abbreviation</button>
        </div>

        <div class="bottom-action-box">
            <div class="btn-container">
                <button class="btn btn-check" onclick="checkTabAnswers()">Check Answers</button>
                <button class="btn btn-retry" onclick="resetTabQuiz()">Try Again</button>
            </div>
        </div>
    </div>

    <script>
        // Quiz Data
        const quizData = [
            {
                section: 1,
                tab: "yes-no",
                title: "I. Which of the following statements do you agree with? Write (Yes) if you agree or (No) if you do not agree.",
                questions: [
                    { type: 'radio', q: "You need to apologize if. the subject is complex.", options: ["Yes", "No"], ans: "No" },
                    { type: 'radio', q: "You should say how long your presentation will last at the beginning.", options: ["Yes", "No"], ans: "Yes" },
                    { type: 'radio', q: "You should signpost and summarize for each of the main points.", options: ["Yes", "No"], ans: "Yes" },
                    { type: 'radio', q: "Paraphrasing should be avoided in your question and answer session.", options: ["Yes", "No"], ans: "No" },
                    { type: 'radio', q: "Conclusion first, summarize later.", options: ["Yes", "No"], ans: "No" },
                    { type: 'radio', q: "You can use risky jokes to make people interested in your presentation.", options: ["Yes", "No"], ans: "No" },
                    { type: 'radio', q: "Long and elaborate sentences are suitable to show your good language skills.", options: ["Yes", "No"], ans: "No" },
                    { type: 'radio', q: "Speaking with boring voice is a skillful tool to make an awesome presentation.", options: ["Yes", "No"], ans: "No" },
                    { type: 'radio', q: "When you have a large vocabulary, you should use it.", options: ["Yes", "No"], ans: "No" },
                    { type: 'radio', q: "We can criticize our audience.", options: ["Yes", "No"], ans: "No" },
                    { type: 'radio', q: "Choosing the right and simple words are the best.", options: ["Yes", "No"], ans: "Yes" },
                    { type: 'radio', q: "Talking too fast is very good to show your good language kills.", options: ["Yes", "No"], ans: "No" },
                    { type: 'radio', q: "Rhetorical questions can be an effective communication tool during your presentation.", options: ["Yes", "No"], ans: "Yes" },
                    { type: 'radio', q: "You should use open arms gesture while giving a presentation.", options: ["Yes", "No"], ans: "Yes" },
                    { type: 'radio', q: "Dramatic structures pattern is very useful tool to make an awesome presentation.", options: ["Yes", "No"], ans: "Yes" },
                    { type: 'radio', q: "Asking check-up questions is a suitable method to get better understanding.", options: ["Yes", "No"], ans: "Yes" }
                ]
            },
            {
                section: 2,
                tab: "bda",
                title: "II. Determine whether the action described happens Before note taking (B), During note taking (D) and After note taking (A).",
                questions: [
                    { type: 'radio', q: "If in a lecture look at the course outline to see what has been covered, what will be covered, and how it all fits together.", options: ["B", "D", "A"], ans: "B" },
                    { type: 'radio', q: "Talk with other students about the lecture", options: ["B", "D", "A"], ans: "A" },
                    { type: 'radio', q: "Make a habit of carrying out short weekly reviews of your notes.", options: ["B", "D", "A"], ans: "A" },
                    { type: 'radio', q: "Highlight key points from your notes for exam preparation.", options: ["B", "D", "A"], ans: "A" },
                    { type: 'radio', q: "Write notes in your own words", options: ["B", "D", "A"], ans: "D" },
                    { type: 'radio', q: "Leave space on the side for expanding your notes when you have more time", options: ["B", "D", "A"], ans: "D" },
                    { type: 'radio', q: "Read the material that will be covered in the upcoming lecture", options: ["B", "D", "A"], ans: "B" },
                    { type: 'radio', q: "Date and give a title to each set of notes and keep them separate for each course you are taking", options: ["B", "D", "A"], ans: "D" },
                    { type: 'radio', q: "Number your pages for easy reference and linking of concepts", options: ["B", "D", "A"], ans: "B" },
                    { type: 'radio', q: "Read over your notes from the last lecture", options: ["B", "D", "A"], ans: "B" },
                    { type: 'radio', q: "Sit where you can clearly see and hear the lecture presentation without distractions", options: ["B", "D", "A"], ans: "D" },
                    { type: 'radio', q: "Remember to include the correct bibliographical information for all sources", options: ["B", "D", "A"], ans: "B" },
                    { type: 'radio', q: "Review and reflect on your notes soon after lectures to consolidate your understanding.", options: ["B", "D", "A"], ans: "A" },
                    { type: 'radio', q: "Form questions on your notes to find the significance of the content and its application to other fields of knowledge.", options: ["B", "D", "A"], ans: "A" },
                    { type: 'radio', q: "Review and expand your notes by filling in the missing gaps, correcting errors, and making sure that you understand all abbreviation. (For Unseen)", options: ["B", "D", "A"], ans: "A" },
                    { type: 'radio', q: "Practise reciting the information using only keywords. (For Unseen)", options: ["B", "D", "A"], ans: "A" },
                    { type: 'radio', q: "Record definition of technical terms exactly given. (For Unseen)", options: ["B", "D", "A"], ans: "D" },
                    { type: 'radio', q: "Prepare to label your notes to identify them as author's direct quotations or your own comments. (For Unseen)", options: ["B", "D", "A"], ans: "B" },
                    { type: 'radio', q: "Use keywords such as 'consequently' or 'therefore' for summaries. (For Unseen)", options: ["B", "D", "A"], ans: "D" },
                    { type: 'radio', q: "Become acquainted with symbols and abbreviations to help you to take notes efficiently. (For Unseen)", options: ["B", "D", "A"], ans: "B" },
                    { type: 'radio', q: "Use different colors, symbols or underlying to highlight points related to important themes. (For Unseen)", options: ["B", "D", "A"], ans: "D" },
                    { type: 'radio', q: "Include lectures' examples of abstract ideas to help jog your memory of the concept. (For Unseen)", options: ["B", "D", "A"], ans: "D" },
                    { type: 'radio', q: "Use the time when your lecture pauses during a presentation to review your notes. (For Unseen)", options: ["B", "D", "A"], ans: "D" }
                ]
            },
            {
                section: 3,
                tab: "abbrev",
                title: "III. Symbolize for the following abbreviations",
                questions: [
                    { type: 'input', q: "as soon as possible", ans: "ASAP" },
                    { type: 'special-radio', q: "and OR plus", options: ["&OR+", "+/&", "&", "+"], ans: "&OR+" },
                    { type: 'special-radio', q: "greater than", options: [">", "<", "=", "≠"], ans: ">" },
                    { type: 'special-radio', q: "less than", options: ["<", ">", "=", "≠"], ans: "<" },
                    { type: 'input', q: "number", ans: "no." },
                    { type: 'special-radio', q: "equal OR the same as", options: ["=", "≠", ">", "<"], ans: "=" },
                    { type: 'special-radio', q: "not equal OR not the same as", options: ["≠", "=", "<", ">"], ans: "≠" },
                    { type: 'input', q: "for example", ans: "eg" },
                    { type: 'input', q: "that is", ans: "ie" },
                    // because ၏ အဖြေမှန်အား အစက်သုံးစက်စောက်ထိုးပုံစံ (∵) သို့ ပြောင်းလဲထားပါသည်
                    { type: 'special-radio', q: "because", options: ["∵", "∴", "⁘", "::"], ans: "∵" } 
                ]
            },
            {
                section: 4,
                tab: "abbrev",
                title: "IV. Symbolize for the following abbreviations",
                questions: [
                    { type: 'special-radio', q: "as a result of consequences of", options: ["<----->", "-->", "+", "ff"], ans: "<----->" },
                    { type: 'special-radio', q: "resulting in", options: ["-->", "<----->", "ff", "*"], ans: "-->" },
                    { type: 'input', q: "and/also", ans: "+" },
                    { type: 'input', q: "following", ans: "ff" },
                    { type: 'special-radio', q: "Most importantly", options: ["*", "esp", "&", "w/"], ans: "*" },
                    { type: 'input', q: "Especially", ans: "esp" },
                    { type: 'input', q: "And", ans: "&" },
                    { type: 'input', q: "with", ans: "w/" },
                    { type: 'input', q: "Without", ans: "w/o" },
                    { type: 'input', q: "against", ans: "vs" }
                ]
            },
            {
                section: 5,
                tab: "abbrev",
                title: "V. Symbolize for the following abbreviations",
                questions: [
                    { type: 'input', q: "Achievement", ans: "ACH" },
                    { type: 'input', q: "All the best", ans: "ATB" },
                    { type: 'input', q: "At this moment", ans: "ATM" },
                    { type: 'input', q: "Before", ans: "B4" },
                    { type: 'input', q: "Call me", ans: "CM" },
                    { type: 'input', q: "See you", ans: "CU" },
                    { type: 'input', q: "Wait", ans: "W8" },
                    { type: 'input', q: "Why", ans: "Y" },
                    { type: 'input', q: "Sleeping", ans: "zzz" },
                    { type: 'input', q: "Face to face", ans: "F2F" },
                    { type: 'input', q: "Thanks", ans: "TKS" },
                    { type: 'input', q: "What", ans: "W@" },
                    { type: 'input', q: "Late", ans: "L8" },
                    { type: 'input', q: "Later", ans: "L8R" },
                    { type: 'input', q: "Very", ans: "VRI" }
                ]
            }
        ];

        let currentTab = "yes-no"; 
        let activeQuestionsTracker = []; 

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function switchTab(tabName) {
            currentTab = tabName;
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const selectedBtn = document.querySelector(`.tab-btn[onclick="switchTab('${tabName}')"]`);
            if(selectedBtn) selectedBtn.classList.add('active');

            document.getElementById('score-text').innerText = "0";
            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-content');
            container.innerHTML = '';
            activeQuestionsTracker = [];

            let overallIndex = 0;
            const filteredSections = quizData.filter(sec => sec.tab === currentTab);

            filteredSections.forEach((section) => {
                const header = document.createElement('h3');
                header.className = 'section-title';
                header.innerText = section.title;
                container.appendChild(header);

                let shuffledQuestions = shuffleArray([...section.questions]);

                shuffledQuestions.forEach((item) => {
                    activeQuestionsTracker.push(item);

                    const card = document.createElement('div');
                    card.className = 'question-card';
                    card.setAttribute('data-tab-index', overallIndex);

                    if (item.type === 'radio' || item.type === 'special-radio') {
                        let optionsHTML = '';
                        item.options.forEach(opt => {
                            optionsHTML += `
                                <label class="radio-label">
                                    <input type="radio" name="tq_${overallIndex}" value="${opt}"> ${opt}
                                </label>
                            `;
                        });

                        card.innerHTML = `
                            <span class="question-text">${overallIndex + 1}. ${item.q}</span>
                            <div class="radio-group">${optionsHTML}</div>
                            <span class="feedback-text"></span>
                        `;
                    } else if (item.type === 'input') {
                        card.innerHTML = `
                            <div class="inline-answer">
                                <span class="question-text">${overallIndex + 1}. ${item.q}</span>
                                <span>Ans: <input type="text" class="underline-input" name="tq_${overallIndex}" autocomplete="off"></span>
                                <span class="feedback-text"></span>
                            </div>
                        `;
                    }

                    container.appendChild(card);
                    overallIndex++;
                });
            });

            document.getElementById('total-text').innerText = activeQuestionsTracker.length;
        }

        function checkTabAnswers() {
            let score = 0;

            activeQuestionsTracker.forEach((item, index) => {
                const card = document.querySelector(`.question-card[data-tab-index="${index}"]`);
                const feedbackText = card.querySelector('.feedback-text');
                let userAns = "";
                let isCorrect = false;

                if (item.type === 'radio' || item.type === 'special-radio') {
                    const selected = document.querySelector(`input[name="tq_${index}"]:checked`);
                    userAns = selected ? selected.value : "";
                    isCorrect = (userAns === item.ans);
                } else if (item.type === 'input') {
                    const inputElement = document.querySelector(`input[name="tq_${index}"]`);
                    userAns = inputElement ? inputElement.value.trim() : "";
                    isCorrect = (userAns === item.ans);
                }

                if (isCorrect) {
                    score++;
                    card.className = "question-card correct-ans";
                    feedbackText.innerHTML = " ✓";
                    feedbackText.className = "feedback-text correct-text";
                } else {
                    card.className = "question-card wrong-ans";
                    feedbackText.innerHTML = ` ✗ (Correct: ${item.ans})`;
                    feedbackText.className = "feedback-text wrong-text";
                }
            });

            document.getElementById('score-text').innerText = score;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetTabQuiz() {
            document.getElementById('score-text').innerText = "0";
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = function() {
            switchTab('yes-no');
        };
    </script>
</body>
</html>
